name: Build Android

on:
  workflow_dispatch:
    inputs:
      aab:
        description: "Also build the Play Store AAB"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
          } > android/key.properties

      - name: Give Gradle more memory (CI runner has 16 GB)
        run: sed -i 's/-Xmx[0-9]*[mMgG]/-Xmx6g/; s/^org.gradle.workers.max=.*/org.gradle.workers.max=4/' android/gradle.properties

      - run: flutter pub get

      - name: Build APK (arm64)
        run: >
          flutter build apk --release --target-platform android-arm64 --split-per-abi
          --obfuscate --split-debug-info=build/symbols
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Build AAB
        if: ${{ inputs.aab }}
        run: >
          flutter build appbundle --release
          --obfuscate --split-debug-info=build/symbols
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: outfitly-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.aab }}
        with:
          name: outfitly-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: debug-symbols
          path: build/symbols
          retention-days: 30
